<app-navbar-dashboard />

<div class="bg-black min-h-screen text-white overflow-x-hidden max-w-screen px-4 py-10 sm:pl-72">
  <h2 class="text-xl sm:text-2xl font-semibold mb-6">Gestión de Reseñas</h2>

  <div *ngIf="loading" class="flex justify-center items-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
    <span class="ml-3 text-gray-400">Cargando reviews...</span>
  </div>

  <div *ngIf="!loading" class="bg-neutral-800 rounded-lg p-4 shadow-md">
    <table mat-table [dataSource]="dataSource" matSort class="w-full">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let review">#{{ review.id }}</td>
      </ng-container>
      <!-- Libro -->
      <ng-container matColumnDef="libro">
        <th mat-header-cell *matHeaderCellDef>Libro</th>
        <td mat-cell *matCellDef="let review">
          <span>{{ review.libro?.titulo }}</span>
        </td>
      </ng-container>
      <!-- Contenido -->
      <ng-container matColumnDef="contenido">
        <th mat-header-cell *matHeaderCellDef>Comentario</th>
        <td mat-cell *matCellDef="let review">{{ review.contenido }}</td>
      </ng-container>
      <!-- Valoración -->
      <ng-container matColumnDef="valoracion">
        <th mat-header-cell *matHeaderCellDef>Valoración</th>
        <td mat-cell *matCellDef="let review">
          <span class="text-yellow-400">⭐ {{ review.valoracion }}</span>
        </td>
      </ng-container>
      <!-- Fecha -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let review">{{ review.fecha }}</td>
      </ng-container>
      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let review">
          <button (click)="editarReview(review)" class="bg-blue-600 hover:bg-blue-700 rounded px-3 py-1 mr-2">Editar</button>
          <button (click)="eliminarReview(review)" class="bg-red-600 hover:bg-red-700 rounded px-3 py-1">Eliminar</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [length]="totalItems" [pageSize]="itemsPerPage" [pageIndex]="currentPage - 1"
      [pageSizeOptions]="[5, 10]" (page)="onPageChange($event)" showFirstLastButtons>
    </mat-paginator>
  </div>

  <!-- Modal editar review -->
  <div *ngIf="mostrarDialogoEditar" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md border border-gray-700">
      <h2 class="text-xl font-semibold mb-4 text-white">Editar Review</h2>
      <form [formGroup]="reviewForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Comentario</label>
          <textarea formControlName="contenido" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Valoración</label>
          <input type="number" formControlName="valoracion" min="1" max="5" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white"/>
        </div>
      </form>
      <div class="flex justify-end gap-3 mt-6">
        <button (click)="cerrarDialogoEditar()" class="px-4 py-2 text-gray-400 hover:text-white">Cancelar</button>
        <button (click)="guardarReview()" [disabled]="!reviewForm.valid" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal eliminar review -->
  <div *ngIf="mostrarDialogoEliminar" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md border border-gray-700">
      <h2 class="text-xl font-semibold text-red-400 mb-4">Confirmar Eliminación</h2>
      <div class="mb-6">
        <p class="text-gray-300">¿Estás seguro de que deseas eliminar esta review?</p>
      </div>
      <div class="flex justify-end gap-3">
        <button (click)="cerrarDialogoEliminar()" class="px-4 py-2 text-gray-400 hover:text-white">Cancelar</button>
        <button (click)="confirmarEliminacion()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">Eliminar</button>
      </div>
    </div>
  </div>
</div>
