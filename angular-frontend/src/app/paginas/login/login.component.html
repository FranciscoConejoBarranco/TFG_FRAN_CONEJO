<!-- Hero section con imagen de fondo de libros modernos -->
<div
  class="relative h-80 bg-cover bg-center"
  style="background-image: url(img/bg-img/breadcumb4.jpg)"
>
  <!-- Overlay con gradiente moderno -->
  <div
    class="absolute inset-0 bg-gradient-to-r from-indigo-900 to-purple-700 opacity-85"
  ></div>

  <div class="container mx-auto px-4 h-full">
    <div class="flex items-center justify-center h-full relative z-10">
      <div class="text-center">
        <h1 class="text-5xl font-bold text-white mb-2">Bubooks</h1>
        <h2 class="text-3xl font-light text-white">Iniciar Sesión</h2>
      </div>
    </div>
  </div>
</div>

<!-- Área de formulario con diseño moderno -->
<div class="bg-gradient-to-b from-gray-50 to-white py-16">
  <div class="container mx-auto px-4">
    <div class="max-w-2xl mx-auto">
      <div class="text-center mb-10">
        <h3 class="text-2xl font-semibold text-indigo-900">
          Ingresa para poder usar BuBooks
        </h3>
        <p class="text-gray-600 mt-2">
          Accede a tu cuenta y descubre nuevos libros
        </p>
      </div>

      <div
        class="bg-white rounded-xl shadow-xl p-8 border-t-4 border-indigo-600"
      >
        <form #formulario="ngForm" (ngSubmit)="enviar()">
          <div class="space-y-6">
            <!-- Mensaje de error general -->
            <div
              *ngIf="error"
              class="text-sm text-red-600 bg-red-50 p-3 rounded-md text-center"
            >
              {{ error }}
            </div>

            <!-- Campo Email -->
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Correo electrónico</label
              >
              <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="modelo.email"
                #email="ngModel"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                placeholder="ejemplo@correo.com"
              />
              <div
                *ngIf="email.invalid && (email.dirty || email.touched)"
                class="mt-2 text-sm text-red-600 bg-red-50 p-2 rounded-md"
              >
                El email es obligatorio y debe tener un formato válido
              </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Contraseña</label
              >
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                name="password"
                [(ngModel)]="modelo.password"
                #password="ngModel"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                placeholder="Ingresa tu contraseña"
              />
              <div
                *ngIf="password.invalid && (password.dirty || password.touched)"
                class="mt-2 text-sm text-red-600 bg-red-50 p-2 rounded-md"
              >
                La contraseña es obligatoria
              </div>

              <button
                type="button"
                class="text-xs mt-2 text-indigo-600"
                (click)="togglePassword()"
              >
                {{ showPassword ? "Ocultar" : "Mostrar" }} contraseña
              </button>
            </div>

            <!-- Botón de envío -->
            <div class="mt-8">
              <button
                class="w-full px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition"
                type="submit"
                [disabled]="isLoading || formulario.invalid"
              >
                <span *ngIf="isLoading">Cargando...</span>
                <span *ngIf="!isLoading">Iniciar sesión</span>
              </button>
              <div class="mt-6 text-center">
                <a
                  routerLink="/registro"
                  class="text-indigo-600 hover:text-indigo-800 font-medium"
                >
                  ¿No tienes cuenta aún? Regístrate
                </a>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
