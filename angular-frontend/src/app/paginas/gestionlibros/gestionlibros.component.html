<app-navbar-dashboard />

<div class="bg-gradient-to-br from-gray-900 via-black to-gray-900 min-h-screen text-white overflow-x-hidden">
  <main class="flex-1 p-6 sm:ml-64 max-sm:ml-0 sm:p-10">
    
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-green-400 to-blue-400 bg-clip-text text-transparent mb-2">
        Gestión de Libros
      </h1>
      <p class="text-gray-400">Administra los libros registrados en el sistema</p>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
      <span class="ml-3 text-gray-400">Cargando libros...</span>
    </div>

    <!-- Tabla -->
    <div *ngIf="!loading" class="bg-gray-800/50 backdrop-blur-sm rounded-xl border border-gray-700/50 overflow-hidden">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="dataSource" matSort class="w-full">

          <!-- ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-700 text-white font-semibold p-4">ID</th>
            <td mat-cell *matCellDef="let libro" class="p-4 text-gray-300">#{{ libro.id }}</td>
          </ng-container>

          <!-- Título -->
          <ng-container matColumnDef="titulo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-700 text-white font-semibold p-4">Título</th>
            <td mat-cell *matCellDef="let libro" class="p-4 font-medium text-white">{{ libro.titulo }}</td>
          </ng-container>

          <!-- Autor -->
          <ng-container matColumnDef="autor">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-700 text-white font-semibold p-4">Autor</th>
            <td mat-cell *matCellDef="let libro" class="p-4 text-gray-400">{{ libro.autor }}</td>
          </ng-container>

          <!-- Acciones -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="bg-gray-700 text-white font-semibold p-4">Acciones</th>
            <td mat-cell *matCellDef="let libro" class="p-4">
              <div class="flex gap-2">
                <button (click)="eliminarLibro(libro)" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-lg text-sm transition-colors flex items-center gap-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                  </svg>
                  Eliminar
                </button>
              </div>
            </td>
          </ng-container>

          <!-- Filas -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-gray-700/30 transition-colors border-b border-gray-700/50"></tr>
        </table>
      </div>

      <!-- Paginador -->
      <div class="bg-gray-700/30 p-4">
        <mat-paginator [length]="totalItems" [pageSize]="itemsPerPage" [pageIndex]="currentPage - 1"
          [pageSizeOptions]="[5, 10]" [showFirstLastButtons]="true" (page)="onPageChange($event)">
        </mat-paginator>
      </div>
    </div>
  </main>
</div>
