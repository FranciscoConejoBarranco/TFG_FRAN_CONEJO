<div class="relative mx-auto my-0 max-w-[600px]">
  <input
    class="py-6 pr-16 pl-8 w-full text-xl transition-all bg-white bg-opacity-90 border-[none] duration-[0.3s] ease-[ease] rounded-[50px] shadow-[0_4px_20px_rgba(0,0,0,0.2)] text-zinc-800 max-sm:py-5 max-sm:pr-14 max-sm:pl-6 max-sm:w-full max-sm:text-base max-sm:rounded-[30px] max-sm:shadow-[0_3px_15px_rgba(0,0,0,0.2)]"
    type="text"
    placeholder="¿Qué tipo de historia buscas hoy?"
    [formControl]="searchControl"
    (keydown.enter)="ejecutarBusqueda()"
  />

  <!-- Botón de búsqueda -->
  <div
    class="absolute right-4 top-2/4 p-2 bg-blue-600 rounded-full transition-all -translate-y-2/4 cursor-pointer duration-[0.3s] ease-[ease] z-[1] max-sm:p-1.5 max-sm:right-[0.8rem]"
    (click)="ejecutarBusqueda()"
  >
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>
</div>

<!-- Resultado de búsqueda -->
<div class="mt-6 max-w-[600px] mx-auto">
  <div *ngIf="libroEncontrado" class="p-5 rounded-2xl shadow-lg bg-white bg-opacity-80 border border-zinc-200 flex items-start gap-4">
    <div class="flex-shrink-0">
      <img 
        *ngIf="libroEncontrado.imagen" 
        [src]="libroEncontrado.imagen" 
        alt="Portada del libro" 
        class="w-20 h-28 object-cover rounded-lg shadow-sm border"
      />
      <div *ngIf="!libroEncontrado.imagen" class="w-20 h-28 flex items-center justify-center bg-gray-200 text-gray-500 rounded-lg text-sm">
        Sin imagen
      </div>
    </div>

    <div *ngIf="libroEncontrado" class="space-y-1 ml-0 md:ml-20 cursor-pointer" (click)="verDetalles(libroEncontrado.titulo)">
      <h3 class="text-2xl font-bold text-zinc-900 leading-tight">
        {{ libroEncontrado.titulo }}
      </h3>
      <div class="flex items-center gap-2 text-zinc-600">
        <span class="text-sm font-medium">Autor:</span>
        <span class="text-sm font-semibold text-zinc-800">{{ libroEncontrado.autor }}</span>
      </div>
    </div>
    
  </div>

  <p *ngIf="mensajeError" class="text-red-600 text-center font-semibold text-lg mt-4">
    {{ mensajeError }}
  </p>
</div>
