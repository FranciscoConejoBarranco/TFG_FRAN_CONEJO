<!-- BOTÓN HAMBURGUESA -->
<button
  aria-label="Toggle menu"
  class="fixed top-5 right-8 z-50 p-2.5 cursor-pointer border-none sm:hidden"
  [attr.aria-expanded]="isMenuOpen"
  (click)="toggleMenu()"
  (keydown)="handleKeydown($event)"
>
  <div
    class="my-1.5 h-[3px] w-[25px] bg-white transition-all"
    [ngStyle]="{
      transform: isMenuOpen ? 'rotate(45deg) translateY(8px)' : 'none'
    }"
  ></div>
  <div
    class="my-1.5 h-[3px] w-[25px] bg-white transition-all"
    [ngStyle]="{ opacity: isMenuOpen ? '0' : '1' }"
  ></div>
  <div
    class="my-1.5 h-[3px] w-[25px] bg-white transition-all"
    [ngStyle]="{
      transform: isMenuOpen ? 'rotate(-45deg) translateY(-8px)' : 'none'
    }"
  ></div>
</button>

<nav
  role="navigation"
  aria-label="Main menu"
  class="fixed top-0 left-0 h-full w-[250px] bg-neutral-900/70 backdrop-blur-md shadow-xl transition-transform duration-300 ease-in-out z-40 sm:translate-x-0"
  [class.-translate-x-full]="!isMenuOpen"
>
  <li class="p-4 space-y-2">
    <a
      href="/home"
      class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
      >Inicio</a
    >
  </li>

  <!-- SUPERADMIN -->
  <ul *ngIf="role.includes('ROLE_SUPERADMIN')" class="p-4 space-y-2">
    <li>
      <a
        href="/dashboardadmin"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Dashboard</a
      >
    </li>
    <li>
      <a
        href="/gestionlibros"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Gestión de Libros</a
      >
    </li>
    <li>
      <a
        href="/gestionusuarios"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Gestión de Usuarios</a
      >
    </li>
    <li>
      <a
        href="/gestionreviews"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Gestión de Reseñas</a
      >
    </li>
    <a
      class="flex items-center gap-3 px-4 py-3 text-white rounded-lg hover:bg-white/10 transition-colors duration-200 p-4 space-y-2"
      (click)="logout()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-log-out"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" x2="9" y1="12" y2="12" />
      </svg>
      Cerrar sesión
    </a>
  </ul>

  <!-- USER -->
  <ul *ngIf="role.includes('ROLE_USER')" class="p-4 space-y-2">
    <li>
      <a
        href="/dashboardusuario"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Dashboard</a
      >
    </li>
    <li>
      <a
        href="/perfil"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Perfil</a
      >
    </li>
    <li>
      <a
        href="/mislistas"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Mis listas</a
      >
    </li>
    <li>
      <a
        href="/reviews"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Reseñas</a
      >
    </li>
    <li>
      <a
        href="/recomendados"
        class="block px-4 py-3 rounded-lg text-white hover:bg-white/10 transition-all duration-200"
        >Recomendados</a
      >
    </li>

    <a
      class="flex items-center gap-3 px-4 py-3 text-white rounded-lg hover:bg-white/10 transition-colors duration-200 p-4 space-y-2"
      (click)="logout()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-log-out"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" x2="9" y1="12" y2="12" />
      </svg>
      Cerrar sesión
    </a>
  </ul>
</nav>
