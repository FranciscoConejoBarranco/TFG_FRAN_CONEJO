security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Rutas de autenticación públicas
        auth:
            pattern: ^/auth
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\CustomAuthenticator

        # API protegida con JWT
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\CustomAuthenticator

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        # Rutas públicas de autenticación
        - { path: ^/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/auth/logout, roles: PUBLIC_ACCESS}
        - { path: ^/auth/me, roles: PUBLIC_ACCESS }
        - { path: ^/importar-libros, roles: PUBLIC_ACCESS}
        
        # Todas las rutas de API requieren autenticación
        - { path: ^/api, roles: [ROLE_USER, ROLE_SUPERADMIN] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10